<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water Polo — Cloudflare Worker</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #06121f;
      color: #dbeafe;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: 2px; }
    #hud { display: flex; gap: 16px; font-size: 16px; }
    #score { color: #e2e8f0; }
    #timer { color: #fca5a5; }
    canvas {
      border: 3px solid #1e3a5f;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      max-width: 96vw;
      height: auto;
      background: #0b3b66;
    }
    .hint { margin: 0; font-size: 13px; color: #7d9bbd; }
  </style>
</head>
<body>
  <header>
    <h1>WATER POLO</h1>
    <div id="hud">
      <span id="score">HOME 0 : 0 AWAY</span>
      <span id="timer">1:30</span>
    </div>
  </header>
  <canvas id="game" width="960" height="540"></canvas>
  <p class="hint">Move: WASD/arrows &middot; Sprint: Shift &middot; Space: shoot, or pass when your goalie has the ball &middot; Steals need sustained contact &middot; Ball out = free ball for the opponent &middot; Space: continue after goal/out &middot; R: restart</p>
  <script src="/game.js"></script>
</body>
</html>
