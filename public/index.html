<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Water Polo: free browser game</title>
  <meta name="description" content="Play water polo in your browser: sprint, steal the ball, and score against the AI in 90-second matches." />
  <meta name="keywords" content="water polo, browser game, canvas game, cloudflare worker, free online game" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0b2f3d" />
  <link rel="canonical" href="https://water-polo.zidesign.workers.dev/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/favicon-32.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Water Polo" />
  <meta property="og:url" content="https://water-polo.zidesign.workers.dev/" />
  <meta property="og:title" content="Water Polo: free browser game" />
  <meta property="og:description" content="Play water polo in your browser: sprint, steal the ball, and score against the AI in 90-second matches." />
  <meta property="og:image" content="https://water-polo.zidesign.workers.dev/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Water Polo: free browser game" />
  <meta name="twitter:description" content="Play water polo in your browser: sprint, steal the ball, and score against the AI in 90-second matches." />
  <meta name="twitter:image" content="https://water-polo.zidesign.workers.dev/og-image.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: #0b2f3d;
      color: #dbeafe;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #app {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0b2f3d;
    }
    #match {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: 2px; }
    #hud { display: flex; gap: 16px; font-size: 16px; }
    #score { color: #e2e8f0; }
    #timer { color: #fca5a5; }
    canvas {
      display: block;
      border: 3px solid #1e3a5f;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      max-width: 96vw;
      height: auto;
      background: #0b3b66;
    }
    .hint { margin: 0; font-size: 13px; color: #7d9bbd; }
    #stick, .touch-actions { display: none; }
    .mobile {
      height: 100vh;
      height: 100dvh;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
        max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    }
    .mobile #match {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-columns: clamp(66px, 13vw, 108px) minmax(0, 1fr) clamp(70px, 13vw, 108px);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
    }
    .mobile header {
      grid-column: 1 / -1;
      justify-self: center;
      gap: 12px;
    }
    .mobile h1, .mobile #hud { font-size: clamp(12px, 2.4vh, 16px); }
    .mobile #hud { gap: 10px; }
    .mobile canvas {
      grid-column: 2;
      grid-row: 2;
      justify-self: center;
      max-width: 100%;
      max-height: 100%;
      border-width: 2px;
    }
    .mobile .hint { display: none; }
    .mobile #stick {
      display: grid;
      place-items: center;
      grid-column: 1;
      grid-row: 2;
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #527da4;
      border-radius: 50%;
      background: #10273b;
      touch-action: none;
      user-select: none;
    }
    #stick span {
      width: 44%;
      aspect-ratio: 1;
      border: 2px solid #a5c9ed;
      border-radius: 50%;
      background: #36638b;
      transform: translate(var(--stick-x, 0px), var(--stick-y, 0px));
      pointer-events: none;
    }
    .mobile .touch-actions {
      display: grid;
      grid-column: 3;
      grid-row: 2;
      gap: 8px;
    }
    #mobile-start { text-align: center; }
    #mobile-start h1 { margin: 0 0 12px; }
    #mobile-start p { margin: 0 0 12px; }
    .mobile button {
      min-height: 44px;
      padding: 4px 6px;
      border: 1px solid #527da4;
      border-radius: 8px;
      background: #10273b;
      color: #dbeafe;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      touch-action: manipulation;
    }
    .touch-actions button { touch-action: none; }
    .mobile button:disabled { opacity: 0.6; }
    .mobile button:focus-visible { outline: 2px solid #dbeafe; outline-offset: 2px; }
    .mobile #play, .mobile #action:not(:disabled), #sprint[aria-pressed="true"] {
      background: #fef08a;
      border-color: #fef08a;
      color: #172236;
    }
    #play { min-width: 88px; }
  </style>
</head>
<body>
  <main id="app">
    <section id="mobile-start" hidden>
      <h1>WATER POLO</h1>
      <p id="rotate-prompt" role="status">Rotate your phone to play</p>
      <button id="play" type="button">Play</button>
    </section>
    <section id="match" aria-label="Water polo match">
      <header>
        <h1>WATER POLO</h1>
        <div id="hud">
          <span id="score">HOME 0 : 0 AWAY</span>
          <span id="timer">1:30</span>
        </div>
      </header>
      <canvas id="game" width="960" height="540"></canvas>
      <div id="stick" role="group" aria-label="Movement joystick"><span></span></div>
      <div class="touch-actions">
        <button id="sprint" type="button" aria-pressed="false">Sprint</button>
        <button id="action" type="button">Shoot</button>
      </div>
      <p class="hint">Move: WASD/arrows &middot; Sprint: Shift &middot; Space: shoot, or pass when your goalie has the ball &middot; Steals need sustained contact &middot; Ball out = free ball for the opponent &middot; Space: continue after goal/out &middot; R: restart</p>
    </section>
  </main>
  <script type="module" src="/game.js"></script>
</body>
</html>
